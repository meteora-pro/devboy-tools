# cargo-deny configuration for devboy-tools.
#
# Goals:
#   1. License hygiene — every transitive dep must carry a license that's
#      compatible with our Apache-2.0 distribution (ADR-001) and that
#      downstream consumers of our crates.io libraries (ADR-022) can
#      legally redistribute.
#   2. Advisory hygiene — fail CI on known-vulnerable / unmaintained /
#      yanked crates so that we don't ship them.
#
# Run locally:   cargo deny check
# Run in CI:     same. See .github/workflows/ci.yml `dependency-hygiene`.

[graph]
all-features = true

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories
# ---------------------------------------------------------------------------

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# No ignored advisories. The previously-ignored issues were eliminated by
# upstream upgrades (#308): ratatui 0.30 drops the unmaintained `paste`
# (RUSTSEC-2024-0436); keepass 0.13 + wayland-scanner 0.31.11 pull
# quick-xml >= 0.41, fixing RUSTSEC-2026-0194 / -0195. Keep this empty —
# any new advisory should be fixed (or explicitly re-justified), not ignored.
ignore = []

# ---------------------------------------------------------------------------
# Licenses
# ---------------------------------------------------------------------------

[licenses]
version = 2
# Licenses we accept across the dependency graph. All are
# redistribution-friendly under the project's Apache-2.0 release.
# MPL-2.0 is file-level weak copyleft (modifications to MPL-licensed
# files must be shared under MPL); admitted because we ship MPL crates
# untouched as binary deps. No strong copyleft (GPL, AGPL, LGPL) is
# admitted.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "MPL-2.0",                     # weak (file-level) copyleft, shipped untouched
    # Transitive-only entries:
    "bzip2-1.0.6",                 # bzip2 itself — used by zip → libbz2
    "CDLA-Permissive-2.0",         # webpki-roots ships CA bundle under CDLA
    "BSL-1.0",                     # Boost Software License — clipboard-win, error-code (eframe deps)
    "OFL-1.1",                     # SIL Open Font License — epaint_default_fonts (eframe deps), font files only
    "Ubuntu-font-1.0",             # Ubuntu Font License — epaint_default_fonts, font files only
]
# Crate-level confidence threshold for license detection.
confidence-threshold = 0.8
exceptions = []

# ---------------------------------------------------------------------------
# Bans
# ---------------------------------------------------------------------------

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
deny = []
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
