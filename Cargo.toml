[workspace]
resolver = "2"

members = [
    "crates/devboy-core",
    "crates/devboy-storage",
    "crates/devboy-assets",
    "crates/devboy-executor",
    "crates/devboy-mcp",
    "crates/devboy-cli",
    "crates/devboy-skills",
    # API plugins
    "crates/plugins/api/gitlab",
    "crates/plugins/api/github",
    "crates/plugins/api/clickup",
    "crates/plugins/api/jira",
    "crates/plugins/api/confluence",
    "crates/plugins/api/fireflies",
    "crates/plugins/api/slack",
    # Pipeline plugins
    "crates/plugins/format-pipeline",
    # Research eval tools
    "crates/llm-eval",
]

[workspace.package]
version = "0.26.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/meteora-pro/devboy-tools"
homepage = "https://devboy.pro"
authors = ["Meteora <dev@meteora.pro>"]
readme = "README.md"
# Defaults applied when a crate does not override them. Each publishable
# crate's `Cargo.toml` may add `keywords`/`categories` of its own — Cargo
# silently overrides workspace defaults at the crate level when present.
# `rust-version` is workspace-wide so that publish-time MSRV is consistent.
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"], default-features = false }

# Async traits
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Config
toml = "0.8"
dirs = "6.0"

# SSE / Streaming
reqwest-eventsource = "0.6"
futures = "0.3"

# Testing
mockall = "0.13"
insta = { version = "1.41", features = ["json", "yaml"] }
httpmock = "0.8"
tempfile = "3.15"

# Asset management
sha2 = "0.10"

# Observability (optional)
sentry = { version = "0.35", default-features = false, features = ["rustls", "reqwest", "tracing", "panic", "backtrace", "contexts"] }
sentry-tracing = "0.35"

# Secrets (in-process secret protection: redacted Debug, zeroize on drop)
secrecy = { version = "0.10", features = ["serde"] }

# Internal workspace crates — `version` lets crates.io resolve them when
# the package is published; `path` keeps local builds resolving in-tree.
# Keep `version` synced with `[workspace.package].version`.
devboy-core = { version = "0.26.0", path = "crates/devboy-core" }
devboy-storage = { version = "0.26.0", path = "crates/devboy-storage" }
devboy-assets = { version = "0.26.0", path = "crates/devboy-assets" }
devboy-executor = { version = "0.26.0", path = "crates/devboy-executor" }
devboy-mcp = { version = "0.26.0", path = "crates/devboy-mcp" }
devboy-skills = { version = "0.26.0", path = "crates/devboy-skills" }
devboy-format-pipeline = { version = "0.26.0", path = "crates/plugins/format-pipeline" }
devboy-gitlab = { version = "0.26.0", path = "crates/plugins/api/gitlab" }
devboy-github = { version = "0.26.0", path = "crates/plugins/api/github" }
devboy-clickup = { version = "0.26.0", path = "crates/plugins/api/clickup" }
devboy-jira = { version = "0.26.0", path = "crates/plugins/api/jira" }
devboy-confluence = { version = "0.26.0", path = "crates/plugins/api/confluence" }
devboy-fireflies = { version = "0.26.0", path = "crates/plugins/api/fireflies" }
devboy-slack = { version = "0.26.0", path = "crates/plugins/api/slack" }

[profile.release]
lto = true
codegen-units = 1
strip = true
