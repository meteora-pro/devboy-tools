name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_LOG: warn

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  secrets-discipline:
    name: Secrets discipline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Guard against secrets sneaking back in as plain `String`.
      # Every credential in non-test source under `crates/` must be carried
      # as `secrecy::SecretString` (or a wrapper that redacts on `Debug` and
      # zeroizes on drop) — see ADR-019. Tests are exempt because their
      # fixtures pre-wrap literals at the field boundary.
      #
      # The CLI binary `crates/devboy-cli/src/main.rs` is also exempt
      # because clap value parsers operate on `String` at the user-input
      # boundary; that string is wrapped in `SecretString` immediately on
      # use and never persisted back as a plaintext field.
      - name: Forbid plain String for known secret field names
        run: |
          set -euo pipefail
          # Field names that must never be `String` / `Option<String>`.
          PATTERN='(\b(token|api_key|password|secret|client_secret|access_token|refresh_token|bearer_token)\b)\s*:\s*(Option<)?\s*String'
          # Path-level exemption: `crates/devboy-cli/src/main.rs` (CLI input
          # boundary; see header comment). A blanket `--exclude='main.rs'`
          # would also exempt other binaries (e.g. `crates/llm-eval/src/main.rs`)
          # — undesired. Filter the exact path post-grep instead.
          CLI_MAIN='crates/devboy-cli/src/main.rs'
          if grep -RInE \
                --include='*.rs' \
                --exclude-dir=target \
                --exclude-dir=tests \
                --exclude='*test*.rs' \
                "$PATTERN" crates/ \
              | grep -v '^[^:]*:[0-9]*: *//' \
              | grep -v "^${CLI_MAIN}:" \
              | tee /tmp/leaks.txt; then
            if [ -s /tmp/leaks.txt ]; then
              echo "::error::Plain String secrets detected. Wrap them in secrecy::SecretString (see ADR-019)."
              exit 1
            fi
          fi

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: docs
      # Detect drift between the auto-generated tools reference checked into
      # the repo and what `devboy tools docs` would emit today. Same command
      # contributors run locally — if it fails, regenerate and commit.
      - name: Check tools reference is up to date
        run: |
          cargo run -p devboy-cli --quiet -- tools docs \
            --output docs/guide/reference/tools.md --check
      - name: Check CLI reference is up to date
        run: |
          cargo run -p devboy-cli --quiet -- docs cli \
            --output docs/guide/reference/cli.md --check
      - name: Check site landing matches README.md
        run: python3 scripts/check-readme-sync.py
      - name: Build docs
        run: pnpm build
        working-directory: docs

  plugin-drift:
    name: Plugin manifests drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      # Detect drift between /crates/devboy-skills/skills/ (master) and
      # the committed plugin tree at plugins/claude/skills/ (Codex shares
      # via symlink). Run only the --check, NOT the regenerator:
      # regenerating first would mask real drift in the PR by silently
      # rewriting the tree in the CI workspace before the check.
      - name: Check skill tree is in sync with crates/devboy-skills/skills
        run: scripts/release/build-skills.sh --check
      - name: Check plugin manifests match Cargo workspace version
        run: scripts/release/sync-plugin-version.sh --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features

  rustdoc:
    name: Rustdoc (no deps, no warnings)
    runs-on: ubuntu-latest
    # Builds the rustdoc tree for every workspace crate and fails on
    # any warning — covers missing_docs in `#![warn(missing_docs)]`
    # surfaces (the legacy backlog is hidden behind module-level
    # `#[allow(missing_docs)]`, so warns only fire on *new* leaks)
    # plus broken intra-doc links. Mirrors what docs.rs renders for
    # published crates (ADR-022).
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc --no-deps --workspace --all-features
        run: cargo doc --no-deps --workspace --all-features

  publish-dry-run:
    name: cargo publish --dry-run (devboy-core)
    runs-on: ubuntu-latest
    # `cargo publish --dry-run` resolves internal deps through the
    # registry, not workspace paths — so until devboy-core is on
    # crates.io, only the dep-graph leaf (devboy-core) can complete a
    # full dry-run. Once the first wave is on crates.io, extend this
    # job to cover the rest of the topological order. See ADR-022.
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo publish --dry-run -p devboy-core
        run: cargo publish --dry-run -p devboy-core

  unused-deps:
    name: Unused deps (cargo-machete)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bnjbvr/cargo-machete@main

  cargo-deny:
    name: Dependency hygiene (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  public-api:
    name: Public API drift (cargo-public-api)
    runs-on: ubuntu-latest
    # Diffs each first-wave library against its checked-in baseline at
    # crates/<path>/.public-api/baseline.txt. A non-empty diff means the
    # public surface changed — either justify it (regenerate the
    # baseline in the PR) or shrink it back. See ADR-022 + each crate's
    # .public-api/README.md.
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-public-api
        run: cargo install cargo-public-api --locked --version 0.51.0
      - name: Diff each crate against its baseline
        run: |
          set -euo pipefail
          declare -A CRATES=(
            [devboy-core]=crates/devboy-core
            [devboy-storage]=crates/devboy-storage
            [devboy-assets]=crates/devboy-assets
            [devboy-format-pipeline]=crates/plugins/format-pipeline
            [devboy-gitlab]=crates/plugins/api/gitlab
            [devboy-github]=crates/plugins/api/github
            [devboy-jira]=crates/plugins/api/jira
            [devboy-clickup]=crates/plugins/api/clickup
            [devboy-confluence]=crates/plugins/api/confluence
            [devboy-fireflies]=crates/plugins/api/fireflies
            [devboy-slack]=crates/plugins/api/slack
            [devboy-executor]=crates/devboy-executor
            [devboy-mcp]=crates/devboy-mcp
            [devboy-skills]=crates/devboy-skills
          )
          rc=0
          for crate in "${!CRATES[@]}"; do
            dir="${CRATES[$crate]}"
            baseline="$dir/.public-api/baseline.txt"
            if [ ! -f "$baseline" ]; then
              echo "::warning::no baseline for $crate at $baseline"
              continue
            fi
            current="$(mktemp)"
            cargo public-api --simplified -p "$crate" > "$current"
            if ! diff -u "$baseline" "$current"; then
              echo "::error::public API surface changed for $crate"
              echo "Regenerate with: cargo public-api --simplified -p $crate > $baseline"
              rc=1
            fi
            rm -f "$current"
          done
          exit "$rc"

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    # Secrets are only available in the main repo, not in forks
    # Tests will run in Replay mode (using fixtures) when secrets are not available
    env:
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITLAB_URL: ${{ secrets.GITLAB_URL }}
      GITLAB_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}
      GITHUB_TEST_TOKEN: ${{ secrets.GH_TEST_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Run tests
        run: cargo test --all-features

      # Update fixtures if running on main with secrets
      - name: Commit updated fixtures
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          if [[ -n $(git status --porcelain tests/fixtures/) ]]; then
            echo "📸 Fixtures were updated by real API calls"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add tests/fixtures/
            git commit -m "chore: update test fixtures [skip ci]"
            git push
          fi

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: devboy-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/devboy
            target/${{ matrix.target }}/release/devboy.exe
          if-no-files-found: ignore

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITLAB_URL: ${{ secrets.GITLAB_URL }}
      GITLAB_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}
      GITHUB_TEST_TOKEN: ${{ secrets.GH_TEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        # `--ignore-filename-regex` mirrors the paths listed in
        # codecov.yml `ignore:` so local `cargo llvm-cov` runs match
        # what Codecov reports after its own filter pass.
        run: |
          cargo llvm-cov --all-features --lcov --output-path lcov.info \
            --ignore-filename-regex '(crates/devboy-cli/src/main\.rs|crates/llm-eval/|crates/plugins/format-pipeline/src/bin/eval\.rs)'

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true
