name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_LOG: warn

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: docs
      # Detect drift between the auto-generated tools reference checked into
      # the repo and what `devboy tools docs` would emit today. Same command
      # contributors run locally — if it fails, regenerate and commit.
      - name: Check tools reference is up to date
        run: |
          cargo run -p devboy-cli --quiet -- tools docs \
            --output docs/guide/reference/tools.md --check
      - name: Check CLI reference is up to date
        run: |
          cargo run -p devboy-cli --quiet -- docs cli \
            --output docs/guide/reference/cli.md --check
      - name: Check site landing matches README.md
        run: python3 scripts/check-readme-sync.py
      - name: Build docs
        run: pnpm build
        working-directory: docs

  plugin-drift:
    name: Plugin manifests drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      # Detect drift between /skills/ (master) and the generated
      # plugins/{claude,codex}/skills/ trees. Same command contributors
      # run locally — if it fails, regenerate and commit.
      - name: Build plugin skills
        run: scripts/release/build-skills.sh
      - name: Check skill tree is in sync
        run: scripts/release/build-skills.sh --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    # Secrets are only available in the main repo, not in forks
    # Tests will run in Replay mode (using fixtures) when secrets are not available
    env:
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITLAB_URL: ${{ secrets.GITLAB_URL }}
      GITLAB_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}
      GITHUB_TEST_TOKEN: ${{ secrets.GH_TEST_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Run tests
        run: cargo test --all-features

      # Update fixtures if running on main with secrets
      - name: Commit updated fixtures
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          if [[ -n $(git status --porcelain tests/fixtures/) ]]; then
            echo "📸 Fixtures were updated by real API calls"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add tests/fixtures/
            git commit -m "chore: update test fixtures [skip ci]"
            git push
          fi

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: devboy-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/devboy
            target/${{ matrix.target }}/release/devboy.exe
          if-no-files-found: ignore

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITLAB_URL: ${{ secrets.GITLAB_URL }}
      GITLAB_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}
      GITHUB_TEST_TOKEN: ${{ secrets.GH_TEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        # `--ignore-filename-regex` mirrors the paths listed in
        # codecov.yml `ignore:` so local `cargo llvm-cov` runs match
        # what Codecov reports after its own filter pass.
        run: |
          cargo llvm-cov --all-features --lcov --output-path lcov.info \
            --ignore-filename-regex '(crates/devboy-cli/src/main\.rs|crates/llm-eval/|crates/plugins/format-pipeline/src/bin/eval\.rs)'

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true
