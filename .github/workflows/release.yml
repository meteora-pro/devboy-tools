name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: devboy
            asset_name: devboy-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: devboy
            asset_name: devboy-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: devboy
            asset_name: devboy-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: devboy
            asset_name: devboy-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: devboy.exe
            asset_name: devboy-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Import Apple certificate
        if: contains(matrix.target, 'apple-darwin')
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)

          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 -D -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          EXISTING_KEYCHAINS=$(security list-keychains -d user | sed 's/^[[:space:]]*"//; s/"$//')
          security list-keychains -d user -s $EXISTING_KEYCHAINS "$KEYCHAIN_PATH"

      - name: Sign macOS binary
        if: contains(matrix.target, 'apple-darwin')
        run: |
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          codesign --force --options runtime \
            --sign "$IDENTITY" \
            --timestamp \
            target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Notarize macOS binary
        if: contains(matrix.target, 'apple-darwin')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          zip -j devboy-notarize.zip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          xcrun notarytool submit devboy-notarize.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          rm devboy-notarize.zip

      - name: Cleanup keychain
        if: contains(matrix.target, 'apple-darwin') && always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}
          shasum -a 256 ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.tar.gz.sha256

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.artifact_name }} -DestinationPath ${{ matrix.asset_name }}.zip
          (Get-FileHash ${{ matrix.asset_name }}.zip -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.asset_name }}.zip" | Out-File -Encoding utf8 ${{ matrix.asset_name }}.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.asset_name }}.tar.gz
            target/${{ matrix.target }}/release/${{ matrix.asset_name }}.tar.gz.sha256
            target/${{ matrix.target }}/release/${{ matrix.asset_name }}.zip
            target/${{ matrix.target }}/release/${{ matrix.asset_name }}.zip.sha256
          if-no-files-found: ignore

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" \) -exec mv {} release/ \;

      # Reference docs as release assets — second safety net on top of
      # the PR-time drift gate. Build a fresh CLI binary, run both
      # `--check` modes against the committed snapshots, and (if green)
      # attach the snapshots to the GitHub Release so a user pulling
      # the tagged version can read the matching reference offline
      # without cloning the repo. We deliberately do NOT regenerate +
      # commit — that would require write access to main from the
      # release pipeline, which we do not want.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-docs

      - name: Build CLI for docs verification
        run: cargo build --release -p devboy-cli

      - name: Verify reference docs match the tagged binary
        run: |
          ./target/release/devboy docs cli \
            --output docs/guide/reference/cli.md --check
          ./target/release/devboy tools docs \
            --output docs/guide/reference/tools.md --check

      - name: Stage reference docs as release assets
        run: |
          cp docs/guide/reference/cli.md   release/devboy-cli-reference.md
          cp docs/guide/reference/tools.md release/devboy-tools-reference.md

      - name: Generate changelog
        id: changelog
        run: |
          DATE=$(date +%Y-%m-%d)
          echo "## ${GITHUB_REF_NAME} (${DATE})" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### What's Changed" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"- %s" >> CHANGELOG.md
          else
            git log --no-merges --pretty=format:"- %s" >> CHANGELOG.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: release/*
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}

  npm-publish:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Prepare platform packages
        run: |
          VERSION="${{ steps.version.outputs.value }}"

          # Map: artifact name -> npm package dir
          declare -A ARTIFACT_TO_PKG=(
            ["devboy-linux-x86_64"]="devboy-tools-linux-x64"
            ["devboy-linux-arm64"]="devboy-tools-linux-arm64"
            ["devboy-macos-x86_64"]="devboy-tools-darwin-x64"
            ["devboy-macos-arm64"]="devboy-tools-darwin-arm64"
          )

          # Unix platforms
          for artifact in "${!ARTIFACT_TO_PKG[@]}"; do
            pkg_dir="npm/${ARTIFACT_TO_PKG[$artifact]}"
            mkdir -p "$pkg_dir/bin"

            tar -xzf "artifacts/$artifact/$artifact.tar.gz" -C "$pkg_dir/bin/"
            chmod 755 "$pkg_dir/bin/devboy"

            # Set version in package.json
            jq --arg v "$VERSION" '.version = $v' "$pkg_dir/package.json" > "$pkg_dir/package.json.tmp"
            mv "$pkg_dir/package.json.tmp" "$pkg_dir/package.json"
          done

          # Windows
          WIN_PKG="npm/devboy-tools-win32-x64"
          mkdir -p "$WIN_PKG/bin"
          unzip -o "artifacts/devboy-windows-x86_64.exe/devboy-windows-x86_64.exe.zip" -d "$WIN_PKG/bin/"
          jq --arg v "$VERSION" '.version = $v' "$WIN_PKG/package.json" > "$WIN_PKG/package.json.tmp"
          mv "$WIN_PKG/package.json.tmp" "$WIN_PKG/package.json"

      - name: Prepare main package
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          PKG="npm/devboy-tools/package.json"

          # Set version and update optionalDependencies versions
          jq --arg v "$VERSION" '
            .version = $v |
            .optionalDependencies |= with_entries(.value = $v)
          ' "$PKG" > "$PKG.tmp"
          mv "$PKG.tmp" "$PKG"

      - name: Publish platform packages
        run: |
          for pkg_dir in npm/devboy-tools-*/; do
            echo "Publishing $(jq -r .name "$pkg_dir/package.json")..."
            cd "$pkg_dir"
            npm publish --access public
            cd "$GITHUB_WORKSPACE"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.DEVBOY_TOOLS_NPM_TOKEN }}

      - name: Publish main package
        run: |
          cd npm/devboy-tools
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.DEVBOY_TOOLS_NPM_TOKEN }}

  plugin-marketplace-sync:
    name: Sync plugin marketplace
    needs: npm-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # Bring plugin manifests in line with the just-released Cargo
      # workspace version, then regenerate plugin skill trees from
      # /crates/devboy-skills/skills/ (in case anything was committed
      # during the release window without the corresponding regen).
      - name: Sync plugin version into manifests
        run: scripts/release/sync-plugin-version.sh

      - name: Regenerate plugin skill trees
        run: scripts/release/build-skills.sh

      - name: Commit and push if changed
        run: |
          if [[ -z "$(git status --porcelain plugins/ .claude-plugin/)" ]]; then
            echo "Plugin manifests already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins/ .claude-plugin/
          git commit -m "release: sync plugin manifests for ${GITHUB_REF_NAME} [skip ci]"
          git push origin main
