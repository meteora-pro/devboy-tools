[package]
name = "devboy-executor"
description = "Tool execution engine for devboy-tools — provider factory, enrichment pipeline, typed output. Wires every devboy provider into a uniform tool surface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["devboy", "ai-agents", "tool-execution", "mcp", "providers"]
categories = ["development-tools", "api-bindings"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
devboy-core = { workspace = true }
devboy-assets = { workspace = true }
devboy-gitlab = { workspace = true }
devboy-github = { workspace = true }
devboy-clickup = { workspace = true }
devboy-jira = { workspace = true }
devboy-confluence = { workspace = true }
devboy-fireflies = { workspace = true }
devboy-slack = { workspace = true }
devboy-telegram = { workspace = true }
devboy-format-pipeline = { workspace = true }

tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
thiserror.workspace = true
base64 = "0.22"
secrecy.workspace = true

[dev-dependencies]
mockall.workspace = true
tokio = { workspace = true, features = ["test-util"] }
httpmock.workspace = true

[lints]
workspace = true
