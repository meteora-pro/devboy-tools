[package]
name = "devboy-skills"
description = "Skills subsystem for devboy-tools — SKILL.md frontmatter parser, install/upgrade lifecycle, manifest model (ADR-012/014)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["devboy", "ai-agents", "skills", "claude", "manifest"]
categories = ["development-tools", "parser-implementations"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
devboy-core = { workspace = true }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
dirs.workspace = true
sha2.workspace = true

# YAML frontmatter parsing
serde_yaml = "0.9"

# Embed baseline SKILL.md files into the binary
rust-embed = { version = "8.5", features = ["debug-embed", "include-exclude"] }

# Time stamps in the manifest
chrono = { version = "0.4", features = ["serde"] }

# ULID session ids (used by the future trace module; feature-gated so the
# core install path stays small)
ulid = { version = "1.1", features = ["serde"], optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
temp-env = "0.3"

[features]
default = ["trace"]
# Session-trace module (ADR-015). Pulls in `ulid` for session ids.
# On by default — disabling it is mostly a CI knob.
trace = ["dep:ulid"]

[lints]
workspace = true
