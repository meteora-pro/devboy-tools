[package]
name = "devboy-secret-kdbx"
description = "KDBX 4 (KeePass) SecretSource — read entries from an existing .kdbx file using a user-provided passphrase + optional keyfile (ADR-021 §8). Interop with KeePass / KeePassXC / KeeWeb / mobile KeePass clients."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["devboy", "secrets", "secret-source", "kdbx", "keepass"]
categories = ["authentication"]
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
devboy-storage = { workspace = true }
async-trait.workspace = true
secrecy.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
# KDBX 4 parser/serializer. `default` features cover read; write
# would need `save_kdbx4` — left off for the read-only MVP.
keepass = { version = "0.12", default-features = false }
# Used to format `NaiveDateTime` fields from `keepass::Times`
# into ISO 8601 strings so they round-trip through the rest of
# the framework's `String`-typed metadata channels (IndexEntry
# `expires_at`, `last_rotated_at`).
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# `save_kdbx4` lets tests construct synthetic KDBX fixtures on the
# fly instead of committing a binary blob to the repo.
keepass = { version = "0.12", default-features = false, features = ["save_kdbx4"] }

[lints]
workspace = true
