[package]
name = "devboy-secret-keychain"
description = "OS keychain SecretSource (macOS/Windows/Linux Secret Service) — refactor of the legacy KeychainStore behind the SecretSource trait."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["devboy", "secrets", "secret-source", "plugin"]
categories = ["authentication"]
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
devboy-storage = { workspace = true }
async-trait.workspace = true
thiserror.workspace = true
secrecy.workspace = true
tracing.workspace = true

# Keychain access — same per-platform feature matrix as devboy-storage so
# we hit the same backend the legacy `KeychainStore` uses.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
