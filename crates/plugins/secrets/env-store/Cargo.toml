[package]
name = "devboy-secret-env-store"
description = "First-class environment-variable SecretSource for CI / containers / bare Linux (ADR-021 §8)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["devboy", "secrets", "secret-source", "plugin"]
categories = ["authentication"]
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
devboy-storage = { workspace = true }
async-trait.workspace = true
thiserror.workspace = true
secrecy.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile.workspace = true
temp-env = { version = "0.3", features = ["async_closure"] }

[lints]
workspace = true
