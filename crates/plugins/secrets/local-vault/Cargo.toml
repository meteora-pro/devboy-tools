[package]
name = "devboy-secret-local-vault"
description = "Encrypted local-vault SecretSource that talks to devboy-secrets-agent over UNIX socket (ADR-021 §8 + ADR-023)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["devboy", "secrets", "secret-source", "plugin"]
categories = ["authentication"]
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
devboy-core = { workspace = true }
devboy-storage = { workspace = true }
devboy-secrets-agent = { workspace = true }
async-trait.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
secrecy.workspace = true
tracing.workspace = true

[dev-dependencies]
devboy-vault-crypto = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
tempfile.workspace = true
temp-env = { version = "0.3", features = ["async_closure"] }

[lints]
workspace = true
