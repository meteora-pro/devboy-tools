[package]
name = "devboy-github"
description = "GitHub provider for devboy-tools — implements IssueProvider, MergeRequestProvider, and Provider against the GitHub REST API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["devboy", "github", "issues", "pull-requests", "ai-agents"]
categories = ["api-bindings", "development-tools"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
devboy-core = { workspace = true }
reqwest.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
secrecy.workspace = true
chrono = { version = "0.4", default-features = false, features = ["serde"] }
regex = "1"
urlencoding = "2"

[dev-dependencies]
mockall.workspace = true
httpmock.workspace = true
tokio.workspace = true

[lints]
workspace = true
