[package]
name = "devboy-gitlab"
description = "GitLab provider for devboy-tools — implements IssueProvider, MergeRequestProvider, and Provider against the GitLab REST API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["devboy", "gitlab", "issues", "merge-requests", "ai-agents"]
categories = ["api-bindings", "development-tools"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
devboy-core = { workspace = true }
reqwest.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
secrecy.workspace = true
regex = "1"
urlencoding = "2"

[dev-dependencies]
mockall.workspace = true
httpmock.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
