[package]
name = "devboy-fireflies"
description = "Fireflies provider for devboy-tools — meeting transcripts and summaries over the Fireflies GraphQL API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["devboy", "fireflies", "meetings", "transcripts", "ai-agents"]
categories = ["api-bindings", "development-tools"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
devboy-core = { workspace = true }
reqwest.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
chrono = "0.4"
secrecy.workspace = true

[dev-dependencies]
httpmock.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
