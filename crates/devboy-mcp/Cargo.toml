[package]
name = "devboy-mcp"
description = "MCP (Model Context Protocol) server for devboy-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
devboy-core = { path = "../devboy-core" }
devboy-assets = { path = "../devboy-assets" }
devboy-executor = { path = "../devboy-executor" }
devboy-gitlab = { path = "../plugins/api/gitlab" }
devboy-github = { path = "../plugins/api/github" }
devboy-clickup = { path = "../plugins/api/clickup" }
devboy-storage = { path = "../devboy-storage" }
devboy-format-pipeline = { path = "../plugins/format-pipeline" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
reqwest.workspace = true
reqwest-eventsource.workspace = true
futures.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
base64 = "0.22"

[dev-dependencies]
mockall.workspace = true
async-trait.workspace = true
httpmock.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
