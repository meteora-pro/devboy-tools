[package]
name = "devboy-mcp"
description = "MCP (Model Context Protocol) server for devboy-tools — JSON-RPC 2.0 over stdio, exposing every devboy provider as MCP tools to AI agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["devboy", "mcp", "ai-agents", "json-rpc", "claude"]
categories = ["development-tools", "api-bindings"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
devboy-core = { workspace = true }
devboy-assets = { workspace = true }
devboy-executor = { workspace = true }
devboy-confluence = { workspace = true }
devboy-format-pipeline = { workspace = true }
devboy-storage = { workspace = true }
# K16 — `kdbx_describe_metadata` + `kdbx_edit_metadata` MCP
# tools route directly into the KDBX plugin. Pulls in the
# `keepass` crate transitively (~Argon2 KDF + chacha20).
devboy-secret-kdbx = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
reqwest.workspace = true
reqwest-eventsource.workspace = true
futures.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
async-trait.workspace = true
thiserror.workspace = true
secrecy.workspace = true

[dev-dependencies]
mockall.workspace = true
httpmock.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
