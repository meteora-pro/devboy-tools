[package]
name = "devboy-cli"
description = "Command-line interface for devboy-tools — `devboy` binary. Primary distribution is npm (@devboy-tools/cli); `cargo install devboy-cli` is the secondary channel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["devboy", "ai-agents", "cli", "mcp", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "devboy"
path = "src/main.rs"

[features]
default = []
sentry = ["devboy-core/sentry", "dep:sentry-tracing", "dep:sentry"]

[dependencies]
devboy-core = { workspace = true }
devboy-executor = { workspace = true }
devboy-mcp = { workspace = true }
devboy-storage = { workspace = true }
devboy-secret-patterns = { workspace = true }
devboy-secrets-agent = { workspace = true }
devboy-secrets-ui = { workspace = true, features = ["gui"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
# `eframe` powers the windowed `secrets ui --gui` launcher. Pinned
# to the same egui 0.34.x range that `devboy-secrets-ui::gui`
# uses so widget code and the host run against the same types.
# `default-features = false` drops the persistence feature we
# don't need (no app-state save between runs).
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
devboy-secret-keychain = { workspace = true }
devboy-secret-local-vault = { workspace = true }
devboy-secret-1password = { workspace = true }
devboy-secret-vault = { workspace = true }
devboy-secret-env-store = { workspace = true }
devboy-github = { workspace = true }
devboy-gitlab = { workspace = true }
devboy-clickup = { workspace = true }
devboy-jira = { workspace = true }
devboy-confluence = { workspace = true }
devboy-fireflies = { workspace = true }
devboy-slack = { workspace = true }
devboy-format-pipeline = { workspace = true }
devboy-skills = { workspace = true }
serde_yaml = "0.9"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
clap-markdown = "0.1"
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
async-trait.workspace = true
futures.workspace = true
reqwest.workspace = true
dialoguer = "0.11"
chrono = "0.4"
toml.workspace = true
dirs.workspace = true
flate2 = "1.1"
tar = "0.4"
zip = "8.4"
secrecy.workspace = true
sentry = { workspace = true, optional = true }
sentry-tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile.workspace = true
httpmock.workspace = true
temp-env = { version = "0.3", features = ["async_closure"] }

[build-dependencies]
chrono = "0.4"

[lints]
workspace = true
