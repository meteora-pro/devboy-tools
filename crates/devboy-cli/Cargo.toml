[package]
name = "devboy-cli"
description = "Command-line interface for devboy-tools — the `devboy` binary. Distributed via npm (@devboy-tools/cli) and prebuilt release binaries."
version.workspace = true
# Not a crates.io library: this is the app binary and it hard-depends on the
# internal secrets plugins (publish = false). crates.io ships only the reusable
# libraries (see #308). Distribution is npm + release binaries.
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["devboy", "ai-agents", "cli", "mcp", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "devboy"
path = "src/main.rs"

[features]
default = []
sentry = ["devboy-core/sentry", "dep:sentry-tracing", "dep:sentry"]

[dependencies]
devboy-core = { workspace = true }
devboy-executor = { workspace = true }
devboy-mcp = { workspace = true }
devboy-storage = { workspace = true }
devboy-secret-patterns = { workspace = true }
devboy-secrets-agent = { workspace = true }
# `devboy-secrets-ui` (no `gui` feature here) supplies the TUI
# inventory/dialog rendering and the shared inventory data types
# (InventoryRow, InventoryState, DialogState, RowStatus). The
# `gui` feature pulls in egui and is consumed by the standalone
# `devboy-secrets-ui-bin` crate, not by the CLI.
devboy-secrets-ui = { workspace = true }
devboy-token-catalog = { workspace = true }
regex.workspace = true
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
devboy-secret-keychain = { workspace = true }
devboy-secret-local-vault = { workspace = true }
devboy-secret-1password = { workspace = true }
# Drives `devboy secrets kdbx peek` — reads a KDBX 4 file and
# prints its entry inventory without the values. Pulled in only
# for the CLI peek path; the heavy-weight UI integration sits in
# devboy-secrets-ui-bin.
devboy-secret-kdbx = { workspace = true }
devboy-secret-env-store = { workspace = true }
devboy-github = { workspace = true }
devboy-gitlab = { workspace = true }
devboy-clickup = { workspace = true }
devboy-jira = { workspace = true }
devboy-linear = { workspace = true }
devboy-confluence = { workspace = true }
devboy-fireflies = { workspace = true }
devboy-slack = { workspace = true }
devboy-telegram = { workspace = true }
devboy-format-pipeline = { workspace = true }
devboy-skills = { workspace = true }
serde_yaml = "0.9"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
clap-markdown = "0.1"
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
async-trait.workspace = true
futures.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-tls", "multipart", "blocking"] }
dialoguer = "0.11"
chrono = "0.4"
toml.workspace = true
dirs.workspace = true
flate2 = "1.1"
tar = "0.4"
zip = "8.4"
secrecy.workspace = true
sentry = { workspace = true, optional = true }
sentry-tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile.workspace = true
httpmock.workspace = true
temp-env = { version = "0.3", features = ["async_closure"] }

[build-dependencies]
chrono = "0.4"

[lints]
workspace = true
