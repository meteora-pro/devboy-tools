[package]
name = "devboy-secrets-agent"
description = "Long-running daemon that owns the unlocked local-vault and serves it over JSON-RPC on a UNIX socket (ADR-023 §3.3)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["devboy", "secrets", "daemon", "json-rpc", "ipc"]
categories = ["authentication", "command-line-utilities"]
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bin]]
name = "devboy-secrets-agent"
path = "src/main.rs"

[lib]
name = "devboy_secrets_agent"
path = "src/lib.rs"

[dependencies]
devboy-core.workspace = true
devboy-vault-crypto.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
secrecy.workspace = true
dirs.workspace = true
devboy-secret-patterns.workspace = true
# Not unix-gated: `totp_session` holds the shared secret in a
# `Zeroizing` buffer and compiles on every platform.
zeroize = "1.8"

# Unix-only deps for socket creation, file permissions, and peer credential checks.
[target.'cfg(unix)'.dependencies]
# `term` carries both halves the passphrase prompt needs: termios
# for the echo-off dance, and `nix::pty` so the tests can drive that
# prompt over a real terminal rather than a stand-in. `fs` adds
# `isatty`, which is how a caller-supplied terminal path is checked
# to actually be a terminal (Ф14).
nix = { version = "0.30", default-features = false, features = ["user", "process", "term", "fs"] }

[dev-dependencies]
tempfile.workspace = true
temp-env = "0.3"

[lints]
workspace = true
