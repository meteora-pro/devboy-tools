# ---------------------------------------------------------------------------
# Agent / OTEL — Claude Code specifics
# ---------------------------------------------------------------------------

[[rules]]
id = "claude_code_otel_user_email_attr"
description = "Claude Code OTEL resource attribute user.email"
pattern = '''(?i)\buser\.email["']?\s*[:=]\s*["']?[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}'''
severity = "medium"
category = "agent_otel.claude_code"
[rules.strategy]
kind = "mask"
replacement = "user.email=[REDACTED]"

[[rules]]
id = "mcp_bearer_token_env"
description = "MCP bearer token in env-style assignment"
pattern = '''(?i)(MCP|DEVBOY)[_\-]?(API[_\-]?)?TOKEN["']?\s*[:=]\s*["']?[A-Za-z0-9_\-]{20,}'''
severity = "high"
category = "agent_otel.mcp"
[rules.strategy]
kind = "mask"
replacement = "[MCP_TOKEN_ENV_REDACTED]"

[[rules]]
id = "anthropic_api_key_env"
description = "Anthropic API key as env-var assignment"
pattern = '''(?i)ANTHROPIC[_\-]?API[_\-]?KEY["']?\s*[:=]\s*["']?sk-ant-[A-Za-z0-9_\-]{60,}'''
severity = "high"
category = "agent_otel.claude_code"
[rules.strategy]
kind = "mask"
replacement = "ANTHROPIC_API_KEY=[REDACTED]"

# ---------------------------------------------------------------------------
# High-entropy fallback — last resort generic detection
# ---------------------------------------------------------------------------
# These rely on the entropy_filter strategy to reduce false positives.
# Length-anchored to skip short identifiers; entropy threshold tightens
# the match further.

[[rules]]
id = "generic_high_entropy_hex_40_64"
description = "Generic high-entropy hex string (40-64 chars) — likely a token / hash"
pattern = '\b[a-f0-9]{40,64}\b'
severity = "low"
category = "generic.high_entropy"
[rules.strategy]
kind = "entropy_filter"
min_entropy = 0.0  # use encoding default (Hex = 3.0)

[[rules]]
id = "generic_high_entropy_base64_32_plus"
description = "Generic high-entropy base64 string (32+ chars) — likely a token"
pattern = '\b[A-Za-z0-9+/]{32,}={0,2}\b'
severity = "low"
category = "generic.high_entropy"
[rules.strategy]
kind = "entropy_filter"
min_entropy = 0.0  # use encoding default (Base64 = 3.5)
