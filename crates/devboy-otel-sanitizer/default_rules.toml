# ---------------------------------------------------------------------------
# Generic — common formats
# ---------------------------------------------------------------------------

[[rules]]
id = "jwt_token"
description = "JSON Web Token (3-part base64url)"
pattern = 'eyJ[A-Za-z0-9_\-]{10,}\.eyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}'
severity = "high"
category = "auth_token.jwt"
[rules.strategy]
kind = "mask"
replacement = "[JWT_REDACTED]"

[[rules]]
id = "private_key_pem_block"
description = "PEM-encoded private key marker"
pattern = '-----BEGIN ((RSA|DSA|EC|OPENSSH|PGP) )?PRIVATE KEY-----'
severity = "high"
category = "credential.pem"
skip_validity = true
[rules.strategy]
kind = "mask"
replacement = "[PRIVATE_KEY_REDACTED]"

[[rules]]
id = "ssh_authorized_key_marker"
description = "SSH authorized_keys entry"
pattern = '(ssh-rsa|ssh-ed25519|ecdsa-sha2-nistp256) [A-Za-z0-9+/=]{100,}'
severity = "medium"
category = "credential.ssh"
skip_validity = true
[rules.strategy]
kind = "mask"
replacement = "[SSH_PUBKEY_REDACTED]"

[[rules]]
id = "basic_auth_header"
description = "HTTP Basic auth header value"
pattern = '(?i)authorization:\s*basic\s+[A-Za-z0-9+/=]{8,}'
severity = "high"
category = "auth_header.basic"
skip_validity = true
[rules.strategy]
kind = "mask"
replacement = "Authorization: Basic [REDACTED]"

[[rules]]
id = "bearer_auth_header"
description = "HTTP Bearer auth header (catch-all)"
pattern = '(?i)authorization:\s*bearer\s+[A-Za-z0-9_\-\.~+/=]{16,}'
severity = "high"
category = "auth_header.bearer"
skip_validity = true
[rules.strategy]
kind = "mask"
replacement = "Authorization: Bearer [REDACTED]"

[[rules]]
id = "credit_card_visa_mastercard"
description = "Credit card number (Visa/MC/Amex/Discover, basic shape)"
pattern = '\b(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14}|3[47][0-9]{13}|6(?:011|5[0-9]{2})[0-9]{12})\b'
severity = "high"
category = "pii.credit_card"
[rules.strategy]
kind = "mask"
replacement = "[CC_REDACTED]"

[[rules]]
id = "ssn_us"
description = "US SSN (basic shape — no strict area-code validation)"
pattern = '\b\d{3}-\d{2}-\d{4}\b'
severity = "high"
category = "pii.ssn"
[rules.strategy]
kind = "mask"
replacement = "[SSN_REDACTED]"

[[rules]]
id = "email_address"
description = "Email address (PII, low severity by default)"
pattern = '\b[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}\b'
severity = "low"
category = "pii.email"
[rules.strategy]
kind = "mask"
replacement = "[EMAIL_REDACTED]"

[[rules]]
id = "ipv4_address"
description = "IPv4 address (informational)"
pattern = '\b(?:\d{1,3}\.){3}\d{1,3}\b'
severity = "low"
category = "pii.network"
[rules.strategy]
kind = "mask"
replacement = "[IPV4_REDACTED]"

