# devboy-otel-sanitizer — default rule set
#
# Bundled into the crate via `include_str!` and parsed at startup.
# Loaded by `devboy_otel_sanitizer::load_default_rules()`.
#
# Conventions:
#   - id          stable identifier; surfaces in scan reports
#   - severity    "high" / "medium" / "low" (CI gate fails on high findings)
#   - category    free-form; useful for filtering reports
#   - pattern     Rust regex (no backreferences). Anchor as needed.
#   - applies_to  optional; empty = all OTLP scopes
#   - strategy    kind + parameters; see src/strategy.rs
#
# Validity filters (dictionary, sequential/repeated chars, entropy) run
# before strategy application — false-positive guard against fixtures.
#
# This is a starter set (~80 rules). Full coverage (~150) lands in
# follow-up commits within issue #240.

# ---------------------------------------------------------------------------
# AWS
# ---------------------------------------------------------------------------

[[rules]]
id = "aws_access_key_id"
description = "AWS access key id"
pattern = 'AKIA[0-9A-Z]{16}'
severity = "high"
category = "cloud_credential.aws"
[rules.strategy]
kind = "mask"
replacement = "[AWS_ACCESS_KEY_REDACTED]"

[[rules]]
id = "aws_temporary_access_key"
description = "AWS temporary access key (STS / role chaining)"
pattern = 'ASIA[0-9A-Z]{16}'
severity = "high"
category = "cloud_credential.aws"
[rules.strategy]
kind = "mask"
replacement = "[AWS_TEMP_KEY_REDACTED]"

[[rules]]
id = "aws_secret_access_key"
description = "AWS secret access key (40 chars base64)"
pattern = '''(?i)aws[_\-]?secret[_\-]?(access[_\-]?)?key["']?\s*[:=]\s*["']?[A-Za-z0-9/+=]{40}'''
severity = "high"
category = "cloud_credential.aws"
[rules.strategy]
kind = "mask"
replacement = "[AWS_SECRET_REDACTED]"

[[rules]]
id = "aws_session_token"
description = "AWS session token (STS)"
pattern = 'FwoG[A-Za-z0-9+/=]{100,}'
severity = "high"
category = "cloud_credential.aws"
[rules.strategy]
kind = "mask"
replacement = "[AWS_SESSION_TOKEN_REDACTED]"

[[rules]]
id = "aws_arn"
description = "AWS ARN containing account id"
pattern = 'arn:aws:[a-z0-9\-]+:[a-z0-9\-]*:\d{12}:[A-Za-z0-9_\-/:.*]+'
severity = "low"
category = "cloud_metadata.aws"
[rules.strategy]
kind = "mask"
replacement = "[AWS_ARN_REDACTED]"

